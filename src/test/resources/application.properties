# Nos testes usamos o banco em memoria H2 (modo de compatibilidade com
# PostgreSQL), para os testes rodarem em qualquer maquina sem depender
# de um PostgreSQL instalado.
spring.datasource.url=jdbc:h2:mem:kanvox;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

kanvox.jwt.chave=chave-usada-somente-nos-testes-automatizados-0123456789
kanvox.jwt.validade-horas=1

# Mesmas definicoes do application.properties principal (este arquivo o substitui nos testes)
spring.jpa.open-in-view=true
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Nos testes a transcricao real nunca e chamada (usamos uma implementacao
# falsa), mas as propriedades precisam existir para a aplicacao subir
kanvox.transcricao.chave-api=
kanvox.transcricao.url=http://localhost:9/transcricao-nao-usada-nos-testes
kanvox.transcricao.modelo=whisper-large-v3-turbo

# Envio de e-mail: o host precisa existir para o Spring criar o bean
# JavaMailSender, mas o envio real nunca acontece nos testes — o bean e
# substituido por uma implementacao falsa (ver AutenticacaoControladorTestes)
spring.mail.host=localhost
spring.mail.port=25
kanvox.url-base=http://localhost:8080
