<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kanvox — Redefinir senha</title>
	<link rel="stylesheet" href="css/estilo.css">
	<!-- no <head> de proposito: aplica o tema antes da pagina aparecer -->
	<script src="js/tema.js"></script>
</head>
<body class="pagina-entrada">

	<div id="area-do-tema"></div>

	<main class="cartao-entrada">
		<div class="marca">
			<span class="marca-simbolo" aria-hidden="true">K</span>
			<h1 class="logotipo">Kanvox</h1>
		</div>
		<p class="subtitulo">Defina uma nova senha para a sua conta</p>
		<p id="email-da-conta" class="texto-suave" style="text-align:center;margin:-0.8rem 0 1.6rem;" hidden></p>

		<form id="formulario-redefinir-senha">
			<label>Nova senha
				<input type="password" id="nova-senha" required minlength="6" autocomplete="new-password">
			</label>
			<label>Confirmar nova senha
				<input type="password" id="confirmar-senha" required minlength="6" autocomplete="new-password">
			</label>
			<button type="submit" class="botao-principal botao-largo">Redefinir senha</button>
		</form>

		<p class="link-auxiliar"><a href="/index.html">Voltar para o login</a></p>

		<p id="mensagem" class="mensagem" role="alert" hidden></p>
	</main>

	<script src="js/api.js"></script>
	<script src="js/redefinir-senha.js"></script>
</body>
</html>
