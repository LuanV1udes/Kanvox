spring.application.name=kanvox

# Em producao, o Java escuta so em localhost — o Caddy e o unico servico
# exposto publicamente (portas 80/443), fazendo proxy reverso para ca dentro.
# Em desenvolvimento local, o padrao continua sendo aberto (0.0.0.0).
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# =============================================================
# Kanvox - configuracao da aplicacao
# Em producao, os valores sensiveis vem de variaveis de ambiente
# (RNF-02: credenciais nunca ficam no codigo-fonte).
# Os valores apos os dois pontos sao padroes apenas para
# desenvolvimento local.
# =============================================================

# Banco de dados PostgreSQL
# Em desenvolvimento, o projeto usa um usuario e banco dedicados (kanvox/kanvox),
# criados uma unica vez com os comandos do README — assim nenhuma senha pessoal
# do PostgreSQL fica no codigo.
spring.datasource.url=${BANCO_URL:jdbc:postgresql://localhost:5432/kanvox}
spring.datasource.username=${BANCO_USUARIO:kanvox}
spring.datasource.password=${BANCO_SENHA:kanvox}

# O Hibernate cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update

# Mantem a sessao do banco aberta durante a serializacao do JSON — necessario
# porque as entidades sao usadas direto nas respostas da API (sem camada de DTO).
# Definir explicitamente tambem silencia o aviso do Spring na inicializacao.
spring.jpa.open-in-view=true

# Nao gerar o usuario/senha aleatorios do Spring Security no log:
# a autenticacao do Kanvox e 100% via JWT, esse usuario nunca seria usado
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Chave usada para assinar os tokens JWT (em producao, definir CHAVE_JWT no ambiente)
kanvox.jwt.chave=${CHAVE_JWT:chave-de-desenvolvimento-do-kanvox-trocar-em-producao-0123456789}
# Validade do token em horas (RNF-02: sem refresh token; ao expirar, faz login de novo)
kanvox.jwt.validade-horas=8

# Transcricao de audio via Whisper (RF-05). Por padrao usa o transcritor local
# (pasta transcritor/), que roda na mesma maquina e nao depende de internet.
# Para usar a API da Groq no lugar, defina no ambiente: TRANSCRICAO_URL=https://api.groq.com/openai/v1/audio/transcriptions,
# TRANSCRICAO_MODELO=whisper-large-v3-turbo e TRANSCRICAO_CHAVE_API (a chave nunca fica no codigo, RNF-02)
kanvox.transcricao.chave-api=${TRANSCRICAO_CHAVE_API:}
kanvox.transcricao.url=${TRANSCRICAO_URL:http://127.0.0.1:8001/v1/audio/transcriptions}
# O transcritor local ignora este campo (o modelo vem de WHISPER_MODELO); so a Groq usa
kanvox.transcricao.modelo=${TRANSCRICAO_MODELO:small}

# Limite de tamanho do audio enviado (25MB tambem e o limite da API da Groq)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Envio de e-mail: recuperacao de senha (RF-01.3). Credenciais via variavel de
# ambiente (RNF-02) — para Gmail, gerar uma "senha de app" em vez da senha normal.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_SENHA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL usada para montar o link de redefinicao de senha enviado por e-mail
kanvox.url-base=${KANVOX_URL_BASE:http://localhost:8080}
